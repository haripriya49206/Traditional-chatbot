<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Help Bot | Traditional chatbot prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f0f2;color:#3d1824;font:16px/1.6 system-ui,sans-serif}main{max-width:900px;margin:35px auto;padding:0 24px}.eyebrow{color:#862d49;font-size:12px;font-weight:750;letter-spacing:2px}h1{font-size:38px;line-height:1.15;margin:12px 0}header p{color:#74555f;margin:12px 0 22px}.badge{background:#efd9e1;border-radius:20px;padding:5px 12px;font-size:12px;display:inline-block}.panel{background:white;border:1px solid #e1cbd3;border-radius:18px;overflow:hidden;box-shadow:0 10px 35px #3d182409}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:16px;border-bottom:1px solid #eee0e5}button{cursor:pointer;border:1px solid #d6b5c1;background:#fcf7f9;color:#72253e;border-radius:8px;padding:9px 14px;font:inherit;font-size:14px}button:hover{background:#f1dce4}#chat{height:600px;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}.bubble{max-width:85%;padding:12px 16px;border-radius:12px;background:#f8eef2;white-space:pre-wrap}.user{align-self:flex-end;background:#800020;color:white}.label{font-size:11px;letter-spacing:1px;font-weight:700;margin-bottom:4px}.intent{font-size:11px;color:#825569;margin-top:7px}.compose{border-top:1px solid #eee0e5;padding:16px;display:flex;gap:10px}input{min-width:0;flex:1;padding:12px;border:1px solid #d6b5c1;border-radius:8px;font:inherit}.send{background:#800020;color:white}.send:hover{background:#5c0018}footer{font-size:12px;color:#775563;margin-top:14px}button:focus-visible,input:focus-visible{outline:3px solid #dfaa43;outline-offset:2px}@media(max-width:600px){main{margin:20px auto;padding:0 14px}h1{font-size:30px}.bubble{max-width:95%}}
</style>
<main><header><div class="eyebrow">PROJECT 01 / TRADITIONAL CHATBOT</div><h1>Campus Help Bot</h1><p>Simple questions. Clear answers. Built with deterministic rules.</p><span class="badge">Local prototype · No LLM · Fictional campus information</span></header><br>
<section class="panel" aria-label="Chatbot"><div class="toolbar"><button data-prompt="help">Capabilities</button><button data-prompt="library hours">Library</button><button data-prompt="admissions">Admissions</button><button data-prompt="tuition">Tuition</button><button data-prompt="IT support">IT support</button><button id="clear">Clear chat</button></div><div id="chat" role="log" aria-live="polite" aria-label="Conversation"></div><form class="compose"><input id="message" aria-label="Your message" placeholder="Ask about library hours, admissions, tuition…" autocomplete="off"><button class="send" type="submit">Send</button></form></section><footer>Messages stay in this page and local server memory; refreshing clears the conversation. Use demonstration inputs only.</footer></main>
<script>
const chat=document.querySelector('#chat'),input=document.querySelector('#message');let busy=false;
function add(text,role,intent){const b=document.createElement('div');b.className='bubble '+role;const l=document.createElement('div');l.className='label';l.textContent=role==='user'?'YOU':'CAMPUS HELP BOT';b.append(l,document.createTextNode(text));if(intent){const i=document.createElement('div');i.className='intent';i.textContent='Matched intent: '+intent;b.append(i)}chat.append(b);chat.scrollTop=chat.scrollHeight}
function welcome(){add("Hello! Ask me a campus question or choose Capabilities to see my supported topics.",'bot')}
async function send(text){if(busy)return;busy=true;add(text||'[empty message]','user');input.value='';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});const data=await r.json();if(!r.ok)throw Error(data.error);add(data.reply,'bot',data.intent)}catch(e){add('Unable to connect. Check that python3 app.py is still running.','bot')}finally{busy=false;input.focus()}}
document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();send(input.value)});document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>send(b.dataset.prompt)));document.querySelector('#clear').onclick=()=>{if(!busy){chat.replaceChildren();welcome();input.focus()}};welcome();
</script></html>
